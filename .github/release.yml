changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: "🚀 新功能 (Features)"
      labels:
        - enhancement
        - feature
        - feat
    - title: "🐛 缺陷修复 (Bug Fixes)"
      labels:
        - bug
        - fix
    - title: "⚡ 性能优化 (Performance)"
      labels:
        - performance
        - perf
    - title: "🛠️ 构建与工程维护 (Maintenance & CI/CD)"
      labels:
        - ci
        - build
        - chore
        - dependencies
    - title: "📝 杂项与文档 (Documentation & Other Changes)"
      labels:
        - "*"
