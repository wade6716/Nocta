name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 (如 v0.1.0 或 v0.1.0-alpha.1)'
        required: false
        type: string
        default: 'v0.1.0'
      release_draft:
        description: '发布为草稿 (Draft Release)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '标记为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-tauri:
    name: Build (${{ matrix.name_suffix }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x64 (仅构建 NSIS .exe 安装包，去除 WiX MSI 重复压缩)
          - platform: windows-latest
            args: '--bundles nsis'
            rust_targets: ''
            name_suffix: 'Windows x64'
            asset_name_pattern: '[name]_[version]_windows_[arch][setup][ext]'
            mpv_platform: 'windows'
            mpv_arch: 'x86_64'

          # 2. macOS Apple Silicon (M1/M2/M3/M4 系列芯片)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
            rust_targets: 'aarch64-apple-darwin'
            name_suffix: 'macOS Apple Silicon'
            asset_name_pattern: '[name]_[version]_macos_aarch64[ext]'
            mpv_platform: 'macos'
            mpv_arch: 'aarch64'

          # 3. macOS Intel (x86_64 系列芯片)
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles dmg'
            rust_targets: 'x86_64-apple-darwin'
            name_suffix: 'macOS Intel'
            asset_name_pattern: '[name]_[version]_macos_x64[ext]'
            mpv_platform: 'macos'
            mpv_arch: 'x86_64'

          # 4. Linux x64 (仅构建 .deb 安装包，去除 AppImage 重度压缩)
          - platform: ubuntu-22.04
            args: '--bundles deb'
            rust_targets: ''
            name_suffix: 'Linux x64'
            asset_name_pattern: '[name]_[version]_linux_[arch][ext]'
            mpv_platform: 'linux'
            mpv_arch: 'x86_64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Disable Windows Defender for Build Performance
        if: matrix.platform == 'windows-latest'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe", "rustc.exe", "link.exe" -ErrorAction SilentlyContinue

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libmpv-dev \
            patchelf \
            xdg-utils

      - name: Install macOS Dependencies
        if: startsWith(matrix.platform, 'macos')
        run: brew install mpv

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup libmpv and Wrapper Libraries
        run: node scripts/setup-mpv.mjs --platform ${{ matrix.mpv_platform }} --arch ${{ matrix.mpv_arch }}

      - name: Build and Release via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || github.ref_name }}"
          releaseName: "Nocta · 夜幕 ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || github.ref_name }}"
          generateReleaseNotes: true
          assetNamePattern: "${{ matrix.asset_name_pattern }}"
          releaseDraft: "${{ inputs.release_draft || false }}"
          prerelease: "${{ inputs.prerelease || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}"
          args: ${{ matrix.args }}

  # 无论 Release 是否已提前创建，构建完成后由该 Job 统一强制更新 Release 正文与清理旧名称产物
  finalize-release:
    name: Finalize Release Notes & Cleanup
    needs: release-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Release Notes & Cleanup Legacy Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || github.ref_name }}"
        run: |
          # 1. 基于仓库模板生成正文头部与平台指引
          cp .github/release-template.md release_notes.md

          # 2. 调用 GitHub API 自动生成带分类的更新日志
          CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG_NAME" \
            --jq .body 2>/dev/null || true)

          if [ -n "$CHANGELOG" ]; then
            echo "" >> release_notes.md
            echo "$CHANGELOG" >> release_notes.md
          fi

          # 3. 强制覆盖更新已有的 Release 正文与标题 (避免因 Release 已存在而漏更)
          gh release edit "$TAG_NAME" -F release_notes.md --title "Nocta · 夜幕 $TAG_NAME"

          # 4. 自动清理旧格式遗留资产文件 (不包含 windows/macos/linux 关键词的文件)
          OLD_ASSETS=$(gh release view "$TAG_NAME" --json assets --jq '.assets[] | select(.name | test("(windows|macos|linux)") | not) | .name' 2>/dev/null || true)
          for asset in $OLD_ASSETS; do
            echo "Deleting legacy unbranded asset: $asset"
            gh release delete-asset "$TAG_NAME" "$asset" -y || true
          done
