name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号（留空则自动读取 package.json 版本生成 v<version>）'
        required: false
        type: string
        default: ''
      release_draft:
        description: '发布为草稿 (Draft Release)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '标记为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 阶段 1：在最廉价高效的 Linux Runner 上单次编译前端并解析发版元数据
  build-frontend:
    name: Build Frontend & Metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      release_draft: ${{ steps.meta.outputs.release_draft }}
      tauri_cli_version: ${{ steps.meta.outputs.tauri_cli_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_RELEASE_DRAFT: ${{ inputs.release_draft }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const refType = process.env.REF_TYPE || "";
            const refName = process.env.REF_NAME || "";
            const inputTag = (process.env.INPUT_TAG_NAME || "").trim();
            const tagName = refType === "tag" ? refName : (inputTag || ("v" + pkg.version));
            const releaseName = "Nocta · 夜幕 " + tagName;
            const isPrerelease = (process.env.INPUT_PRERELEASE === "true" || /(alpha|beta|rc)/i.test(tagName)) ? "true" : "false";
            const releaseDraft = process.env.INPUT_RELEASE_DRAFT === "true" ? "true" : "false";
            const rawCli = (pkg.devDependencies && pkg.devDependencies["@tauri-apps/cli"]) || "2.12.2";
            const tauriCliVersion = rawCli.replace(/^[^\d]*/, "");
            const lines = [
              `tag_name=${tagName}`,
              `release_name=${releaseName}`,
              `is_prerelease=${isPrerelease}`,
              `release_draft=${releaseDraft}`,
              `tauri_cli_version=${tauriCliVersion}`,
            ];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build

      - name: Upload Prebuilt Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # 阶段 2：4 端并发复编译（直接复用前端 dist/、预编译 cargo-tauri、多层缓存 Rust 与 libmpv）
  release-tauri:
    name: Build (${{ matrix.name_suffix }})
    needs: build-frontend
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x64 (NSIS + zlib 压缩，跳过重复前端编译与 MSI)
          - platform: windows-latest
            args: '--bundles nsis --config src-tauri/tauri.ci.conf.json'
            rust_targets: ''
            name_suffix: 'Windows x64'
            asset_name_pattern: '[name]_[version]_windows_[arch][setup][ext]'
            mpv_platform: 'windows'
            mpv_arch: 'x86_64'
            cli_asset: 'cargo-tauri-x86_64-pc-windows-msvc.zip'

          # 2. macOS Apple Silicon (M1/M2/M3/M4 系列芯片)
          - platform: macos-15
            args: '--target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.ci.conf.json'
            rust_targets: 'aarch64-apple-darwin'
            name_suffix: 'macOS Apple Silicon'
            asset_name_pattern: '[name]_[version]_macos_aarch64[ext]'
            mpv_platform: 'macos'
            mpv_arch: 'aarch64'
            cli_asset: 'cargo-tauri-aarch64-apple-darwin.zip'

          # 3. macOS Intel (x86_64 系列芯片，使用原生 Intel Runner 确保 Homebrew dylib 架构一致)
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.ci.conf.json'
            rust_targets: 'x86_64-apple-darwin'
            name_suffix: 'macOS Intel'
            asset_name_pattern: '[name]_[version]_macos_x64[ext]'
            mpv_platform: 'macos'
            mpv_arch: 'x86_64'
            cli_asset: 'cargo-tauri-x86_64-apple-darwin.zip'

          # 4. Linux x64 (仅构建 .deb 安装包，去除 AppImage 重度压缩)
          - platform: ubuntu-22.04
            args: '--bundles deb --config src-tauri/tauri.ci.conf.json'
            rust_targets: ''
            name_suffix: 'Linux x64'
            asset_name_pattern: '[name]_[version]_linux_[arch][ext]'
            mpv_platform: 'linux'
            mpv_arch: 'x86_64'
            cli_asset: 'cargo-tauri-x86_64-unknown-linux-gnu.tgz'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Disable Windows Defender for Build Performance
        if: matrix.platform == 'windows-latest'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe", "rustc.exe", "link.exe" -ErrorAction SilentlyContinue

      - name: Download Prebuilt Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux Dependencies (Ubuntu, Cached)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libmpv-dev patchelf xdg-utils
          version: ubuntu22-tauri2-v1

      - name: Restore Prebuilt Tauri CLI Cache
        id: tauri-cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ needs.build-frontend.outputs.tauri_cli_version }}-${{ matrix.mpv_platform }}-${{ matrix.mpv_arch }}

      - name: Install Prebuilt cargo-tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CLI_VER: ${{ needs.build-frontend.outputs.tauri_cli_version }}
          CLI_ASSET: ${{ matrix.cli_asset }}
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            CARGO_BIN_DIR="$(cygpath -u "${CARGO_HOME:-$HOME/.cargo}")/bin"
          else
            CARGO_BIN_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
          fi
          mkdir -p "$CARGO_BIN_DIR"

          TMP_DIR="$(mktemp -d)"
          ARCHIVE_PATH="$TMP_DIR/$CLI_ASSET"
          EXTRACT_DIR="$TMP_DIR/extract"
          mkdir -p "$EXTRACT_DIR"

          URL="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${CLI_VER}/${CLI_ASSET}"
          echo "Downloading $URL"
          curl -fsSL --retry 3 --retry-delay 2 "$URL" -o "$ARCHIVE_PATH"

          if [[ "$CLI_ASSET" == *.tgz || "$CLI_ASSET" == *.tar.gz ]]; then
            tar -xzf "$ARCHIVE_PATH" -C "$EXTRACT_DIR"
          elif command -v unzip >/dev/null 2>&1; then
            unzip -oq "$ARCHIVE_PATH" -d "$EXTRACT_DIR"
          elif command -v 7z >/dev/null 2>&1; then
            7z x "$ARCHIVE_PATH" -o"$EXTRACT_DIR" -y >/dev/null
          else
            tar -xf "$ARCHIVE_PATH" -C "$EXTRACT_DIR"
          fi

          CLI_BIN="$(find "$EXTRACT_DIR" -type f \( -name 'cargo-tauri' -o -name 'cargo-tauri.exe' \) | head -n 1)"
          if [ -z "$CLI_BIN" ]; then
            echo "Failed to locate cargo-tauri binary in $CLI_ASSET"
            exit 1
          fi

          cp -f "$CLI_BIN" "$CARGO_BIN_DIR/"
          chmod +x "$CARGO_BIN_DIR/$(basename "$CLI_BIN")" 2>/dev/null || true
          rm -rf "$TMP_DIR"
          cargo tauri --version

      - name: Save Prebuilt Tauri CLI Cache
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ needs.build-frontend.outputs.tauri_cli_version }}-${{ matrix.mpv_platform }}-${{ matrix.mpv_arch }}

      - name: Verify cargo-tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          if command -v cygpath >/dev/null 2>&1; then
            CARGO_BIN_DIR="$(cygpath -u "${CARGO_HOME:-$HOME/.cargo}")/bin"
          else
            CARGO_BIN_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
          fi
          chmod +x "$CARGO_BIN_DIR/cargo-tauri" 2>/dev/null || true
          cargo tauri --version

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: "release-${{ matrix.mpv_platform }}-${{ matrix.mpv_arch }}-v1"

      - name: Restore Self-Contained libmpv Bundle Cache
        id: mpv-cache
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/lib
          key: mpv-bundle-v1-${{ matrix.mpv_platform }}-${{ matrix.mpv_arch }}-${{ hashFiles('scripts/setup-mpv.mjs') }}

      - name: Verify Cached libmpv Libraries
        id: verify-mpv
        shell: bash
        env:
          MPV_PLATFORM: ${{ matrix.mpv_platform }}
        run: |
          ready=false
          case "$MPV_PLATFORM" in
            windows)
              if [ -s "src-tauri/lib/libmpv-wrapper.dll" ] && [ -s "src-tauri/lib/libmpv-2.dll" ]; then
                ready=true
              fi
              ;;
            macos)
              if [ -s "src-tauri/lib/libmpv-wrapper.dylib" ] && \
                 [ -s "src-tauri/lib/libmpv.dylib" ] && \
                 [ -s "src-tauri/lib/libmpv.2.dylib" ] && \
                 [ -s "src-tauri/lib/libMoltenVK.dylib" ] && \
                 [ -s "src-tauri/lib/MoltenVK_icd.json" ]; then
                ready=true
              fi
              ;;
            linux)
              if [ -s "src-tauri/lib/libmpv-wrapper.so" ]; then
                ready=true
              fi
              ;;
          esac
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = "true" ]; then
            echo "Restored cached libmpv bundle for $MPV_PLATFORM:"
            ls -lh src-tauri/lib/
          else
            echo "libmpv cache miss or incomplete for $MPV_PLATFORM, will fetch fresh libraries."
          fi

      - name: Install macOS Dependencies
        if: startsWith(matrix.platform, 'macos') && steps.verify-mpv.outputs.ready != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: brew install mpv molten-vk dylibbundler

      - name: Setup libmpv and Wrapper Libraries
        if: steps.verify-mpv.outputs.ready != 'true'
        run: node scripts/setup-mpv.mjs --platform ${{ matrix.mpv_platform }} --arch ${{ matrix.mpv_arch }}${{ matrix.mpv_platform == 'macos' && ' --wrapper-only' || '' }}

      - name: Bundle Self-Contained libmpv & MoltenVK for macOS
        if: startsWith(matrix.platform, 'macos') && steps.verify-mpv.outputs.ready != 'true'
        run: |
          BREW_PREFIX=$(brew --prefix)
          MPV_LIB="$BREW_PREFIX/opt/mpv/lib/libmpv.2.dylib"
          if [ ! -f "$MPV_LIB" ]; then
            MPV_LIB="$BREW_PREFIX/lib/libmpv.dylib"
          fi

          # 确保目录和已有文件具有写权限，并先清理旧软链/文件，杜绝 cp 报错 Permission denied
          chmod -R u+w src-tauri/lib/ 2>/dev/null || true
          rm -f src-tauri/lib/libmpv*.dylib
          cp -fL "$MPV_LIB" src-tauri/lib/libmpv.dylib
          chmod 755 src-tauri/lib/libmpv.dylib

          # 将 libmpv.dylib 的所有非系统动态库依赖打包进 src-tauri/lib/ 并重写为 @loader_path/
          dylibbundler -of -b \
            -x src-tauri/lib/libmpv.dylib \
            -d src-tauri/lib/ \
            -p "@loader_path/"

          # 同时复制一份 libmpv.2.dylib 以兼容按 SONAME 查找的场景
          rm -f src-tauri/lib/libmpv.2.dylib
          cp -fL src-tauri/lib/libmpv.dylib src-tauri/lib/libmpv.2.dylib
          chmod 755 src-tauri/lib/libmpv.2.dylib

          # 打包 MoltenVK 驱动与 ICD 清单，确保 macOS vo=gpu-next (macvk) 开箱即用
          MOLTENVK_LIB="$BREW_PREFIX/opt/molten-vk/lib/libMoltenVK.dylib"
          if [ ! -f "$MOLTENVK_LIB" ]; then
            MOLTENVK_LIB="$BREW_PREFIX/lib/libMoltenVK.dylib"
          fi
          if [ -f "$MOLTENVK_LIB" ]; then
            rm -f src-tauri/lib/libMoltenVK.dylib
            cp -fL "$MOLTENVK_LIB" src-tauri/lib/libMoltenVK.dylib
            chmod 755 src-tauri/lib/libMoltenVK.dylib
            cat > src-tauri/lib/MoltenVK_icd.json << 'EOF'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "./libMoltenVK.dylib",
              "api_version": "1.2.0"
            }
          }
          EOF
          fi

          # 为所有打包的 dylib 并行赋予写权限与 Ad-hoc 签名，防止 Apple Silicon dyld 因 install_name_tool 修改而拒绝加载
          chmod -R u+w src-tauri/lib/
          find src-tauri/lib -maxdepth 1 -name '*.dylib' -exec chmod 755 {} +
          find src-tauri/lib -maxdepth 1 -name '*.dylib' -print0 | xargs -0 -P "$(sysctl -n hw.ncpu)" -I {} codesign --force --sign - "{}"
          ls -lh src-tauri/lib/

      - name: Save Self-Contained libmpv Bundle Cache
        if: steps.verify-mpv.outputs.ready != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/lib
          key: mpv-bundle-v1-${{ matrix.mpv_platform }}-${{ matrix.mpv_arch }}-${{ hashFiles('scripts/setup-mpv.mjs') }}

      - name: Build and Release via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: 'cargo tauri'
          tagName: ${{ needs.build-frontend.outputs.tag_name }}
          releaseName: ${{ needs.build-frontend.outputs.release_name }}
          generateReleaseNotes: true
          includeUpdaterJson: false
          assetNamePattern: ${{ matrix.asset_name_pattern }}
          releaseDraft: ${{ needs.build-frontend.outputs.release_draft }}
          prerelease: ${{ needs.build-frontend.outputs.is_prerelease }}
          args: ${{ matrix.args }}

  # 阶段 3：无论 Release 是否已提前创建，构建完成后由该 Job 统一强制更新 Release 正文、清理旧名称产物并汇总更新清单
  finalize-release:
    name: Finalize Release Notes & Updater Manifest
    needs: [build-frontend, release-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for Manifest Generation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Release Notes, Cleanup Legacy Assets & Publish Updater Manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.build-frontend.outputs.tag_name }}
          IS_PRERELEASE: ${{ needs.build-frontend.outputs.is_prerelease }}
          RELEASE_DRAFT: ${{ needs.build-frontend.outputs.release_draft }}
        run: |
          set -euo pipefail

          # 1. 基于仓库模板生成正文头部与平台指引
          cp .github/release-template.md release_notes.md

          # 2. 调用 GitHub API 自动生成带分类的更新日志
          CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG_NAME" \
            --jq .body 2>/dev/null || true)

          if [ -n "$CHANGELOG" ]; then
            echo "" >> release_notes.md
            echo "$CHANGELOG" >> release_notes.md
            printf '%s\n' "$CHANGELOG" > updater_notes.md
          else
            printf 'Nocta · 夜幕 %s 更新发布\n' "$TAG_NAME" > updater_notes.md
          fi

          # 3. 强制覆盖更新已有的 Release 正文与标题 (避免因 Release 已存在而漏更)
          gh release edit "$TAG_NAME" -F release_notes.md --title "Nocta · 夜幕 $TAG_NAME"

          # 4. 自动清理旧格式遗留资产文件 (保留跨端安装包、.sig 签名、.tar.gz 与 latest.json)
          OLD_ASSETS=$(gh release view "$TAG_NAME" --json assets --jq '.assets[] | select(.name | test("(windows|macos|linux|^latest\\.json$|\\.sig$|\\.tar\\.gz$)") | not) | .name' 2>/dev/null || true)
          for asset in $OLD_ASSETS; do
            echo "Deleting legacy unbranded asset: $asset"
            gh release delete-asset "$TAG_NAME" "$asset" -y || true
          done

          # 5. 汇总 4 端 .sig 签名并生成无并发竞态的统一 latest.json
          SIG_DIR=$(mktemp -d)
          ASSETS_JSON=$(mktemp)
          gh release view "$TAG_NAME" --json assets > "$ASSETS_JSON"
          gh release download "$TAG_NAME" -p "*.sig" -D "$SIG_DIR" || true

          node scripts/generate-updater-manifest.mjs \
            --assets-json "$ASSETS_JSON" \
            --sig-dir "$SIG_DIR" \
            --version "$TAG_NAME" \
            --notes-file updater_notes.md \
            --output latest.json

          PLATFORM_COUNT=$(node -e "const m = JSON.parse(require('fs').readFileSync('latest.json', 'utf8')); console.log(Object.keys(m.platforms || {}).length);")
          if [ "$PLATFORM_COUNT" -eq 0 ]; then
            echo "::warning::No signed updater platforms found in release assets (ensure TAURI_SIGNING_PRIVATE_KEY secret is configured). Skipping updater manifest upload."
            rm -rf "$SIG_DIR" "$ASSETS_JSON"
            exit 0
          fi

          gh release upload "$TAG_NAME" latest.json --clobber

          # 6. 非草稿发布时同步推送至独立 updater-manifests 孤儿分支，支持 pre-release 无 API 限流检查更新
          if [ "$RELEASE_DRAFT" != "true" ]; then
            MANIFEST_REPO=$(mktemp -d)
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            if git clone --depth 1 --branch updater-manifests "$REPO_URL" "$MANIFEST_REPO" 2>/dev/null; then
              pushd "$MANIFEST_REPO" >/dev/null
            else
              git clone --depth 1 "$REPO_URL" "$MANIFEST_REPO"
              pushd "$MANIFEST_REPO" >/dev/null
              git checkout --orphan updater-manifests
              git rm -rf . >/dev/null 2>&1 || true
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            cp "${GITHUB_WORKSPACE}/latest.json" prerelease.json
            git add prerelease.json

            if [ "$IS_PRERELEASE" != "true" ]; then
              cp "${GITHUB_WORKSPACE}/latest.json" stable.json
              git add stable.json
            fi

            if ! git diff --cached --quiet; then
              git commit -m "chore(updater): publish manifest for $TAG_NAME"
              git push origin HEAD:refs/heads/updater-manifests
            else
              echo "Updater manifests unchanged for $TAG_NAME."
            fi
            popd >/dev/null
            rm -rf "$MANIFEST_REPO"
          fi

          rm -rf "$SIG_DIR" "$ASSETS_JSON"
