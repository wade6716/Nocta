<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- App Icon Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="64" y="64" width="896" height="896" rx="210" ry="210" />
    </clipPath>

    <!-- Play Prism Clip for Internal Refraction -->
    <clipPath id="prismClip">
      <path d="M 442 366 C 442 326 485 301 520 321 L 728 441 C 763 461 763 511 728 531 L 520 651 C 485 671 442 646 442 606 Z" />
    </clipPath>

    <!-- Deep Night Sky Gradients -->
    <linearGradient id="bgBaseGrad" x1="120" y1="80" x2="880" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1021" />
      <stop offset="45%" stop-color="#070B16" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <radialGradient id="nebulaTopRight" cx="780" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#1E1B4B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070B16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaCenterGlow" cx="512" cy="512" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#070B16" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Rim Gradients -->
    <linearGradient id="outerRimGrad" x1="100" y1="64" x2="924" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#475569" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#64748B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="innerRimGrad" x1="512" y1="68" x2="512" y2="956" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.35" />
      <stop offset="15%" stop-color="#64748B" stop-opacity="0.12" />
      <stop offset="85%" stop-color="#1E293B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Crescent Moon Glass Gradients -->
    <linearGradient id="crescentBodyGrad" x1="260" y1="240" x2="640" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#7DD3FC" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.26" />
    </linearGradient>

    <linearGradient id="crescentBorderGrad" x1="280" y1="220" x2="650" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#7DD3FC" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.85" />
    </linearGradient>

    <!-- Play Prism Glassmorphic Gradients -->
    <linearGradient id="prismBodyGrad" x1="440" y1="310" x2="750" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.20" />
    </linearGradient>

    <linearGradient id="prismSpecularGrad" x1="450" y1="315" x2="620" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#BAE6FD" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="prismEdgeGrad" x1="442" y1="305" x2="755" y2="665" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#7DD3FC" stop-opacity="0.80" />
      <stop offset="70%" stop-color="#C4B5FD" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0.90" />
    </linearGradient>

    <!-- Danmaku Comet Trail Gradients (Left Tail -> Bright Core) -->
    <linearGradient id="cyanTrailGrad" x1="210" y1="422" x2="515" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="95%" stop-color="#E0F2FE" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="indigoTrailGrad" x1="165" y1="486" x2="515" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0" />
      <stop offset="25%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.95" />
      <stop offset="95%" stop-color="#E0E7FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="pinkTrailGrad" x1="210" y1="550" x2="515" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DB2777" stop-opacity="0" />
      <stop offset="25%" stop-color="#EC4899" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#F472B6" stop-opacity="0.95" />
      <stop offset="95%" stop-color="#FCE7F3" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- Refracted Wave Gradients inside Prism -->
    <linearGradient id="cyanWaveGrad" x1="500" y1="422" x2="740" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.80" />
      <stop offset="75%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="indigoWaveGrad" x1="500" y1="486" x2="735" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#818CF8" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pinkWaveGrad" x1="500" y1="550" x2="740" y2="505" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#F472B6" stop-opacity="0.80" />
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="iconDropShadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="softAmbientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonTrailGlow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="prismDropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-8" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 1. Outer Squircle Shadow & Metallic Bevel Shell -->
  <g filter="url(#iconDropShadow)">
    <rect x="56" y="56" width="912" height="912" rx="218" ry="218" fill="#0F172A" stroke="url(#outerRimGrad)" stroke-width="4" />
  </g>

  <!-- 2. Clipped Interior App Canvas -->
  <g clip-path="url(#squircleClip)">
    <!-- Deep Night Sky Background -->
    <rect x="64" y="64" width="896" height="896" fill="url(#bgBaseGrad)" />
    <rect x="64" y="64" width="896" height="896" fill="url(#nebulaTopRight)" />
    <rect x="64" y="64" width="896" height="896" fill="url(#nebulaCenterGlow)" />

    <!-- Subtle Starfield Dust -->
    <g fill="#E2E8F0">
      <circle cx="210" cy="190" r="1.5" opacity="0.35" />
      <circle cx="340" cy="150" r="1.2" opacity="0.25" />
      <circle cx="680" cy="175" r="1.8" opacity="0.45" />
      <circle cx="810" cy="260" r="1.4" opacity="0.30" />
      <circle cx="760" cy="390" r="1.6" opacity="0.35" />
      <circle cx="845" cy="540" r="1.2" opacity="0.25" />
      <circle cx="775" cy="700" r="1.8" opacity="0.40" />
      <circle cx="670" cy="820" r="1.3" opacity="0.30" />
      <circle cx="290" cy="810" r="1.5" opacity="0.28" />
      <circle cx="175" cy="690" r="1.2" opacity="0.22" />
      <circle cx="615" cy="295" r="2.0" opacity="0.50" />
      <circle cx="715" cy="610" r="1.5" opacity="0.40" />
    </g>

    <!-- 3. Translucent Crescent Moon (Night Motif) -->
    <g filter="url(#softAmbientGlow)">
      <path
        d="M 488 228
           A 265 265 0 1 0 652 708
           A 228 236 0 1 1 488 228 Z"
        fill="url(#crescentBodyGrad)"
        stroke="url(#crescentBorderGrad)"
        stroke-width="3.5"
        stroke-linejoin="round"
      />
      <!-- Subtle wispy inner reflection on Crescent -->
      <path
        d="M 445 256
           A 248 248 0 0 0 326 520
           A 245 245 0 0 0 585 722"
        stroke="#BAE6FD"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.32"
        fill="none"
      />
    </g>

    <!-- 4. Frosted Glass Play Prism -->
    <g filter="url(#prismDropShadow)">
      <!-- Base Glass Fill -->
      <path
        d="M 442 366 C 442 326 485 301 520 321 L 728 441 C 763 461 763 511 728 531 L 520 651 C 485 671 442 646 442 606 Z"
        fill="url(#prismBodyGrad)"
      />
      <!-- Top-Left Specular Sheen -->
      <path
        d="M 442 366 C 442 326 485 301 520 321 L 728 441 C 745 451 754 468 754 486 L 442 540 Z"
        fill="url(#prismSpecularGrad)"
      />
    </g>

    <!-- 5. Internal Refracted Energy Filaments (Clipped to Play Prism) -->
    <g clip-path="url(#prismClip)">
      <!-- Ambient internal color blooms around comet entry points -->
      <circle cx="505" cy="422" r="52" fill="#38BDF8" opacity="0.22" filter="url(#softAmbientGlow)" />
      <circle cx="508" cy="486" r="52" fill="#818CF8" opacity="0.22" filter="url(#softAmbientGlow)" />
      <circle cx="505" cy="550" r="52" fill="#F472B6" opacity="0.22" filter="url(#softAmbientGlow)" />

      <!-- Cyan Refracted Waves -->
      <path
        d="M 502 422 C 555 422, 575 458, 635 456 C 675 455, 710 442, 748 430"
        stroke="url(#cyanWaveGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M 502 422 C 548 426, 585 440, 645 438 C 685 436, 715 448, 745 455"
        stroke="url(#cyanWaveGrad)"
        stroke-width="1.8"
        stroke-dasharray="3 6"
        stroke-linecap="round"
        opacity="0.85"
        fill="none"
      />

      <!-- Indigo Refracted Waves -->
      <path
        d="M 506 486 C 565 486, 605 474, 660 482 C 695 487, 720 486, 752 486"
        stroke="url(#indigoWaveGrad)"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
      />

      <!-- Pink/Magenta Refracted Waves -->
      <path
        d="M 502 550 C 555 550, 578 514, 638 516 C 678 518, 712 530, 748 542"
        stroke="url(#pinkWaveGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M 502 550 C 550 546, 590 532, 650 534 C 688 535, 718 522, 746 515"
        stroke="url(#pinkWaveGrad)"
        stroke-width="1.8"
        stroke-dasharray="3 6"
        stroke-linecap="round"
        opacity="0.85"
        fill="none"
      />
    </g>

    <!-- Play Prism Crisp Glass Border & Inner Rim (Drawn over refraction for clean glass edge) -->
    <path
      d="M 442 366 C 442 326 485 301 520 321 L 728 441 C 763 461 763 511 728 531 L 520 651 C 485 671 442 646 442 606 Z"
      stroke="url(#prismEdgeGrad)"
      stroke-width="4.5"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M 452 370 C 452 338 487 318 515 334 L 718 451 C 746 467 746 505 718 521 L 515 638 C 487 654 452 634 452 602 Z"
      stroke="#FFFFFF"
      stroke-opacity="0.22"
      stroke-width="1.5"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- 6. Three Danmaku Comet Light Trails (Cyan, Indigo, Pink) -->
    <!-- Top Trail: Aurora Cyan -->
    <g filter="url(#neonTrailGlow)">
      <path
        d="M 210 422 L 502 414 A 8 8 0 0 1 502 430 Z"
        fill="url(#cyanTrailGrad)"
      />
      <ellipse cx="500" cy="422" rx="14" ry="6.5" fill="#FFFFFF" />
    </g>

    <!-- Middle Trail: Electric Indigo -->
    <g filter="url(#neonTrailGlow)">
      <path
        d="M 165 486 L 505 478 A 8 8 0 0 1 505 494 Z"
        fill="url(#indigoTrailGrad)"
      />
      <ellipse cx="503" cy="486" rx="15" ry="6.5" fill="#FFFFFF" />
    </g>

    <!-- Bottom Trail: Starlight Pink -->
    <g filter="url(#neonTrailGlow)">
      <path
        d="M 210 550 L 502 542 A 8 8 0 0 1 502 558 Z"
        fill="url(#pinkTrailGrad)"
      />
      <ellipse cx="500" cy="550" rx="14" ry="6.5" fill="#FFFFFF" />
    </g>

    <!-- Inner Squircle Glass Rim Highlight -->
    <rect x="66" y="66" width="892" height="892" rx="208" ry="208" stroke="url(#innerRimGrad)" stroke-width="3" fill="none" />
  </g>
</svg>
