[package]
name = "emby-tauri-player"
version = "0.1.0"
description = "Modern lightweight Emby Desktop Player with libmpv hardware acceleration and Danmaku"
authors = ["wade"]
edition = "2021"

[lib]
name = "emby_tauri_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
