[package]
name = "nocta"
version = "0.1.0"
description = "Nocta - 夜幕: 沉浸式 Emby 弹幕播放器"
authors = ["wade"]
edition = "2021"

[lib]
name = "nocta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-libmpv = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysproxy = "0.3.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
tauri-plugin-libmpv = { path = "crates/tauri-plugin-libmpv" }


