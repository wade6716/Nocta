[package]
name = "nocta"
version = "0.3.10"
description = "Nocta - 诺塔: 沉浸式 Emby 弹幕播放器"
authors = ["wade"]
edition = "2021"

[lib]
name = "nocta_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-http = { version = "2", features = ["dangerous-settings", "unsafe-headers"] }
tauri-plugin-store = "2"
tauri-plugin-libmpv = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysproxy = "0.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "socks"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
updater-reqwest-socks = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"] }
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
url = "2"

[patch.crates-io]
tauri-plugin-libmpv = { path = "crates/tauri-plugin-libmpv" }

[profile.release]
opt-level = 2
codegen-units = 16
lto = false
strip = "symbols"


